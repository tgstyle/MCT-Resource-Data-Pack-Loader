    if (bpJar != null) {
        implementation files(bpJar)
    } else {
        implementation rfg.deobf("curse.maven:${common.blpl_version}")
    }
    compileOnly rfg.deobf("${common.mjei_version}")
    runtimeOnly rfg.deobf("${common.mjei_version}")

    //implementation rfg.deobf("curse.maven:${common.drtr_version}")

    implementation rfg.deobf("curse.maven:${common.bopl_version}")
    implementation rfg.deobf("${common.ctwk_version}")
    implementation("${common.gscr_version}") { transitive = false }
    implementation rfg.deobf("curse.maven:${common.tcon_version}")
    implementation rfg.deobf("curse.maven:${common.mant_version}")
    implementation rfg.deobf("curse.maven:${common.cnam_version}")

    implementation rfg.deobf("curse.maven:${common.arlb_version}")
    implementation rfg.deobf("curse.maven:${common.wayb_version}")
    implementation rfg.deobf("curse.maven:${common.redf_version}")
    implementation rfg.deobf("curse.maven:${common.cofh_version}")
    compileOnly rfg.deobf("curse.maven:${common.quar_version}")
    compileOnly rfg.deobf("curse.maven:${common.gcor_version}")
    compileOnly rfg.deobf("curse.maven:${common.dngn_version}")
    compileOnly rfg.deobf("curse.maven:${common.lstc_version}")
    compileOnly rfg.deobf("curse.maven:${common.aeth_version}")
    compileOnly rfg.deobf("curse.maven:${common.btwl_version}")
    compileOnly rfg.deobf("curse.maven:${common.ntra_version}")
    compileOnly rfg.deobf("curse.maven:${common.otgn_version}")
    compileOnly rfg.deobf("curse.maven:${common.rtgn_version}")
    compileOnly rfg.deobf("curse.maven:${common.twfo_version}")

    implementation rfg.deobf("curse.maven:${common.tekt_version}")
    implementation rfg.deobf("curse.maven:${common.movl_version}")
    implementation rfg.deobf("curse.maven:${common.ivtk_version}")
    implementation rfg.deobf("curse.maven:${common.rcmp_version}")
    implementation rfg.deobf("curse.maven:${common.mcal_version}")
    runtimeOnly rfg.deobf("curse.maven:${common.cstd_version}")
    runtimeOnly rfg.deobf("curse.maven:${common.thfo_version}")
    runtimeOnly rfg.deobf("curse.maven:${common.cfga_version}")
    runtimeOnly rfg.deobf("curse.maven:${common.pfix_version}")
    //runtimeOnly rfg.deobf("curse.maven:${common.cwor_version}")
    //runtimeOnly rfg.deobf("curse.maven:${common.cucm_version}")
    //runtimeOnly rfg.deobf("curse.maven:${common.mace_version}")

    clientRuntime rfg.deobf("curse.maven:${common.bf3r_version}")

    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    String mixinBooter = modUtils.enableMixins('zone.rong:mixinbooter:10.7', 'mixins.resourcedatapackloader.refmap.json')
    api(mixinBooter) { transitive = false }
    annotationProcessor(mixinBooter) { transitive = false }
