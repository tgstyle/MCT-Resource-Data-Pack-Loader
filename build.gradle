import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
}

class JarStamp {
    static String hash(Set<File> files, File versionProps, File root) {
        def digest = MessageDigest.getInstance('SHA-256')
        files.sort { it.path }.each { File file ->
            digest.update(root.toPath().relativize(file.toPath()).toString().getBytes('UTF-8'))
            digest.update(file.bytes)
        }
        versionProps.readLines().findAll { !it.startsWith('#') && !it.startsWith('build_number=') }.sort().each { digest.update(it.getBytes('UTF-8')) }
        digest.digest().encodeHex().toString()
    }

    static boolean changed(Set<File> files, File versionProps, File root, File stamp) { !stamp.isFile() || stamp.text != hash(files, versionProps, root) }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

def currentBuild = versionProps.getProperty('build_number')?.toInteger() ?: 0
def nextBuild = currentBuild + 1
def stage = versionProps.getProperty('stage') ?: ''
def baseVersion = versionProps.getProperty('version')
def newVersion = "${baseVersion}-b${nextBuild}-${stage}"

version = newVersion
ext.version_buildnumber = nextBuild
ext.stage = stage

println "-> build.gradle applying version: $version (build ${nextBuild})"

tasks.withType(Jar).configureEach {
    archiveVersion.set(newVersion)
}

group = 'mctmods.resourcedatapackloader'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(Jar).configureEach {
    zip64 = true
}

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_forge = versionProps['version_forge']
    version_forge_min = versionProps['version_forge_min']
    version_bp = versionProps.getProperty('version_bp', '[0,)')
    version_curios = versionProps['version_curios']
    version_parchment = versionProps['version_parchment']
    mod_license = gradleProps['mod_license']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
    mod_url = gradleProps['mod_url']
}

def version_replaces = [
        'version'          : project.version,
        'build_number'     : version_buildnumber,
        'version_mc'       : version_minecraft,
        'version_forge'    : version_forge,
        'version_forge_min': version_forge_min,
        'version_bp'       : version_bp,
        'mod_license'      : mod_license,
        'mod_name'         : mod_name,
        'mod_authors'      : mod_authors,
        'mod_description'  : mod_description,
        'mod_url'          : mod_url,
        'stage'            : stage,
]

sourceSets {
    main {
        java { srcDirs = ["$rootDir/src/main/java"] }
        resources { srcDirs = ["$rootDir/src/main/resources"] }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces)
    filesMatching("META-INF/mods.toml") {
        expand version_replaces
    }
    exclude ".cache"
    doLast {
        destinationDir.eachFileRecurse { File file ->
            if (file.file && (file.name.endsWith('.json') || file.name.endsWith('.mcmeta'))) {
                file.setText(JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8')))
            }
        }
    }
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from processResources.destinationDir
    into "$projectDir/out/production/resources"
    include "META-INF/mods.toml"
    dependsOn processResources
}

def devSyncScript = null
for (def dir = rootDir; dir != null && devSyncScript == null; dir = dir.parentFile) {
    def candidate = new File(dir, '#scripts/mods-devsync.gradle')
    if (candidate.isFile()) { devSyncScript = candidate }
}
if (devSyncScript != null) { apply from: devSyncScript }

def bpSource = devSyncScript == null ? null : devSyncPin('MCT-Blast-Plaster', versionProps['devsync_bp'])
def bpJar = bpSource == null ? null : devSyncStaged(bpSource, 'build/blastplaster/blastplaster-dev.jar')
if (bpSource == null) { logger.warn('No Blast Plaster devSync pin: set devsync_bp in version.properties to a snapshot in the devsync cache') }

def bpModsDir = file('run/mods')
TaskProvider<Copy> copyBlastPlasterMod = tasks.register('copyBlastPlasterMod', Copy) {
    onlyIf { bpSource != null }
    from bpSource
    into bpModsDir
    doFirst {
        bpModsDir.mkdirs()
        bpModsDir.listFiles()?.each { old -> if ((old.name.startsWith('MCT-BlastPlaster-') || old.name.startsWith('blastplaster-')) && old.name.endsWith('.jar')) { old.delete() } }
    }
}

legacyForge {
    version = "${version_minecraft}-${version_forge}"

    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_minecraft
    }

    validateAccessTransformers = true

    mods.register(mod_id as String) { sourceSet(sourceSets.main) }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'tgstyle', '--width', '1920', '--height', '1080'
            jvmArgument("-Djava.library.path=/usr/lib64")
            jvmArgument('-Xmx4G')
            jvmArgument('-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile')
            environment 'LD_LIBRARY_PATH', '/usr/lib64'
        }

        server {
            server()
            programArguments.addAll '--nogui'
            jvmArgument('-Xmx4G')
            jvmArgument('-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile')
        }

        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            taskBefore(copyBlastPlasterMod)
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.resourcedatapackloader.refmap.json'
    config 'mixins.resourcedatapackloader.rdpl.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { name = 'ParchmentMC' ; url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
    maven { name = 'Curios' ; url = 'https://maven.theillusivec4.top/' ; content { includeGroup 'top.theillusivec4.curios' } }
    maven { name = 'Modrinth' ; url = 'https://api.modrinth.com/maven' ; content { includeGroup 'maven.modrinth' } }
    maven { name = 'JEI' ; url = 'https://maven.blamejared.com' ; content { includeGroup 'mezz.jei' } }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${version_curios}"
    modRuntimeOnly 'maven.modrinth:betterf3:xo6HmgWj'
    modRuntimeOnly 'maven.modrinth:cloth-config:t8TXrZvZ'
    modCompileOnly "mezz.jei:jei-${version_minecraft}-common-api:15.20.0.112"
    modCompileOnly "mezz.jei:jei-${version_minecraft}-forge-api:15.20.0.112"

    if (bpJar != null) {
        compileOnly files(bpJar)
    }
}

def customGradle = rootProject.file('custom.gradle')
if (customGradle.exists()) apply from: customGradle

def stampInputs = files(sourceSets.main.java.srcDirs, sourceSets.main.resources.srcDirs, file('gradle.properties'), file('build.gradle'), file('custom.gradle'), files('LICENSE', 'LICENSE_ASSETS.txt', 'LICENSE_THIRD_PARTY.txt'), bpJar == null ? [] : bpJar).asFileTree
def stampProps = file('version.properties')
def stampRoot = rootDir
def stampFile = layout.buildDirectory.file('jar-inputs.sha256')
def builtJar = layout.buildDirectory.file("libs/MCT-ResourceDataPackLoader-${version_minecraft}-${baseVersion}-b${currentBuild}-${stage}.jar")
def needsJar = { !builtJar.get().asFile.isFile() || JarStamp.changed(stampInputs.files, stampProps, stampRoot, stampFile.get().asFile) }

tasks.register('bumpVersion') {
    def versionPropsFile = layout.projectDirectory.file('version.properties')
    inputs.file(versionPropsFile)
    outputs.upToDateWhen { false }
    onlyIf { needsJar() }

    doLast {
        def props = new Properties()
        versionPropsFile.asFile.withInputStream { props.load(it) }
        props['build_number'] = nextBuild.toString()
        versionPropsFile.asFile.withOutputStream { props.store(it, null) }
    }
}

tasks.register('optimizePng') {
    def pngPatterns = ["**/*.png"]
    def resourceDirs = sourceSets.main.resources.srcDirs
    def pngFiles = resourceDirs.collectMany { dir -> fileTree(dir: dir, includes: pngPatterns).files as List }
    def execOps = project.services.get(ExecOperations)
    doLast {
        pngFiles.each { File file ->
            long size = file.length()
            execOps.exec { ExecSpec spec -> spec.commandLine('optipng', '-q', '-o7', '-zm1-9', '-strip', 'all', file.absolutePath) }
            long newSize = file.length()
            if (newSize < size) {
                System.out.format("Reduced File size of %s from %d bytes to %d bytes (reduced by %.2f%%)\n",
                        file, size, newSize, ((double) (size - newSize)) / ((double) size) * 100.0)
            }
        }
    }
}

processResources.dependsOn bumpVersion
jar.dependsOn bumpVersion

tasks.register('genIntellijRunsDummy') {}

jar {
    archiveBaseName.set("MCT-ResourceDataPackLoader-${version_minecraft}")
    archiveClassifier.set('')
    from('LICENSE', 'LICENSE_ASSETS.txt', 'LICENSE_THIRD_PARTY.txt')
    manifest.attributes([
            "MixinConfigs": "mixins.resourcedatapackloader.rdpl.json"
    ])
    onlyIf { needsJar() }
}

tasks.named('reobfJar') {
    onlyIf { needsJar() }
    doLast { stampFile.get().asFile.text = JarStamp.hash(stampInputs.files, stampProps, stampRoot) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

idea { module { downloadSources = true; downloadJavadoc = true } }

publishing {
    publications { register('mavenJava', MavenPublication) { from(components.java as SoftwareComponent) }}
    repositories { maven { url = "file://${project.projectDir}/repo" } }
}

build.dependsOn bumpVersion
