pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'MCT-Resource-Data-Pack-Loader'

include ':26.1.2', ':26.2', ':26.3'
project(':26.1.2').projectDir = file('versions/26.1.2')
project(':26.2').projectDir = file('versions/26.2')
project(':26.3').projectDir = file('versions/26.3')
